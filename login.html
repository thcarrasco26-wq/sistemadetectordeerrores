<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - PrediCalc</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="bg-zinc-950 text-white min-h-screen flex items-center justify-center">
    
    <div class="max-w-md w-full mx-6">
        <div class="bg-zinc-900 border border-zinc-700 rounded-3xl p-10 shadow-2xl">
            
            <div class="text-center mb-10">
                <div class="w-20 h-20 bg-gradient-to-br from-orange-500 to-amber-500 rounded-3xl flex items-center justify-center mx-auto mb-5 text-5xl shadow-lg">
                    📊
                </div>
                <h1 class="text-4xl font-bold">PrediCalc</h1>
                <p class="text-zinc-400 mt-2">Inicia sesión para acceder al simulador</p>
            </div>

            <form id="loginForm" class="space-y-6">
                <div>
                    <label class="block text-zinc-400 text-sm mb-2">Usuario</label>
                    <div class="relative">
                        <i class="fas fa-user absolute left-4 top-4 text-zinc-500"></i>
                        <input type="text" id="username" value="demo" 
                               class="w-full bg-zinc-800 border border-zinc-700 rounded-2xl py-4 pl-12 pr-5 focus:border-orange-500 focus:outline-none transition-all">
                    </div>
                </div>

                <div>
                    <label class="block text-zinc-400 text-sm mb-2">Contraseña</label>
                    <div class="relative">
                        <i class="fas fa-lock absolute left-4 top-4 text-zinc-500"></i>
                        <input type="password" id="password" value="123456" 
                               class="w-full bg-zinc-800 border border-zinc-700 rounded-2xl py-4 pl-12 pr-5 focus:border-orange-500 focus:outline-none transition-all">
                    </div>
                </div>

                <button type="submit" 
                        class="w-full bg-orange-500 hover:bg-orange-600 py-4 rounded-2xl font-bold text-lg transition-all flex items-center justify-center gap-3">
                    <i class="fas fa-sign-in-alt"></i>
                    INICIAR SESIÓN
                </button>
            </form>

            <div class="mt-8 text-center text-sm text-zinc-500">
                <p>Usuario demo: <span class="text-orange-400 font-medium">demo</span></p>
                <p>Contraseña: <span class="text-orange-400 font-medium">123456</span></p>
            </div>
        </div>

        <div class="text-center mt-6">
            <a href="index.html" class="text-zinc-400 hover:text-orange-400 transition-colors">
                ← Volver al inicio
            </a>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;

            if (user === "demo" && pass === "123456") {
                window.location.href = "dashboard.html";
            } else {
                alert("❌ Usuario o contraseña incorrectos.\n\nPrueba con:\ndemo / 123456");
            }
        });
    </script>
</body>
</html>
