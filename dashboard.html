<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - PrediCalc</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="bg-zinc-950 text-white min-h-screen">

    <!-- Navbar -->
    <nav class="bg-black border-b border-zinc-800">
        <div class="max-w-7xl mx-auto px-6 py-5 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-orange-500 rounded-2xl flex items-center justify-center text-3xl">📊</div>
                <h1 class="text-3xl font-bold">PrediCalc</h1>
            </div>
            <button onclick="cerrarSesion()" 
                    class="flex items-center gap-2 bg-red-500/10 hover:bg-red-500/20 text-red-400 px-6 py-3 rounded-2xl font-medium transition-all">
                <i class="fas fa-sign-out-alt"></i> Cerrar Sesión
            </button>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-6 py-10">
        <div class="flex justify-between items-end mb-10">
            <div>
                <h1 class="text-4xl font-bold">Simulador de Utilidades</h1>
                <p class="text-zinc-400">Aplicación práctica del Cálculo Diferencial</p>
            </div>
            <div class="text-sm text-orange-400">Nivel II - Investigación</div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">

            <!-- Panel de Entrada -->
            <div class="lg:col-span-1">
                <div class="bg-zinc-900 border border-zinc-700 rounded-3xl p-8">
                    <h2 class="text-2xl font-semibold mb-6 flex items-center gap-3">
                        <i class="fas fa-input text-orange-500"></i> Datos de la Empresa
                    </h2>

                    <div class="space-y-6">
                        <div>
                            <label class="text-zinc-400 text-sm block mb-2">Producción Actual (unidades)</label>
                            <input type="number" id="produccion" value="200" 
                                   class="w-full bg-zinc-800 border border-zinc-700 rounded-2xl px-5 py-4 focus:border-orange-500 outline-none">
                        </div>
                        <div>
                            <label class="text-zinc-400 text-sm block mb-2">Costo Fijo (S/)</label>
                            <input type="number" id="cf" value="1500" 
                                   class="w-full bg-zinc-800 border border-zinc-700 rounded-2xl px-5 py-4 focus:border-orange-500 outline-none">
                        </div>
                        <div>
                            <label class="text-zinc-400 text-sm block mb-2">Costo Variable por Unidad (S/)</label>
                            <input type="number" id="cv" value="12" step="0.1" 
                                   class="w-full bg-zinc-800 border border-zinc-700 rounded-2xl px-5 py-4 focus:border-orange-500 outline-none">
                        </div>
                        <div>
                            <label class="text-zinc-400 text-sm block mb-2">Precio de Venta por Unidad (S/)</label>
                            <input type="number" id="precio" value="25" step="0.1" 
                                   class="w-full bg-zinc-800 border border-zinc-700 rounded-2xl px-5 py-4 focus:border-orange-500 outline-none">
                        </div>

                        <button onclick="calcularOptimo()" 
                                class="w-full bg-gradient-to-r from-orange-500 to-amber-500 py-5 rounded-2xl font-bold text-lg hover:scale-105 transition-all mt-4">
                            <i class="fas fa-calculator"></i> CALCULAR PUNTO ÓPTIMO
                        </button>
                    </div>
                </div>
            </div>

            <!-- Resultados y Gráfica -->
            <div class="lg:col-span-2">
                <div class="bg-zinc-900 border border-zinc-700 rounded-3xl p-8">
                    <h2 class="text-2xl font-semibold mb-6">Resultados del Análisis Matemático</h2>
                    
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10" id="resultados">
                        <!-- Se llena con JavaScript -->
                    </div>

                    <div>
                        <h3 class="text-lg font-medium mb-4 flex items-center gap-2">
                            <i class="fas fa-chart-line text-orange-500"></i> 
                            Gráfica de Costos vs Ingresos
                        </h3>
                        <canvas id="myChart" height="140"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let chartInstance;

        function calcularOptimo() {
            const q = parseFloat(document.getElementById('produccion').value) || 200;
            const cf = parseFloat(document.getElementById('cf').value) || 1500;
            const cv = parseFloat(document.getElementById('cv').value) || 12;
            const p = parseFloat(document.getElementById('precio').value) || 25;

            // Cálculo simplificado usando derivada (Costo Marginal = Ingreso Marginal)
            const qOptimo = Math.round((p - cv) / 0.02); // Modelo cuadrático básico
            const utilidadMax = Math.round(p * qOptimo - (cf + cv * qOptimo + 0.01 * qOptimo * qOptimo));

            // Mostrar resultados
            document.getElementById('resultados').innerHTML = `
                <div class="bg-zinc-800 rounded-3xl p-6 text-center">
                    <p class="text-zinc-400">Producción Óptima</p>
                    <p class="text-5xl font-bold text-emerald-400 mt-3">${qOptimo}</p>
                    <p class="text-sm text-emerald-500">unidades</p>
                </div>
                <div class="bg-zinc-800 rounded-3xl p-6 text-center">
                    <p class="text-zinc-400">Utilidad Máxima</p>
                    <p class="text-5xl font-bold text-emerald-400 mt-3">S/ ${utilidadMax.toLocaleString()}</p>
                </div>
                <div class="bg-zinc-800 rounded-3xl p-6 text-center">
                    <p class="text-zinc-400">Costo Marginal</p>
                    <p class="text-5xl font-bold text-amber-400 mt-3">0.00</p>
                </div>
            `;

            actualizarGrafica(qOptimo, cf, cv, p);
        }

        function actualizarGrafica(qOpt, cf, cv, precio) {
            const ctx = document.getElementById('myChart');
            if (chartInstance) chartInstance.destroy();

            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: Array.from({length: 25}, (_, i) => i * 20),
                    datasets: [
                        {
                            label: 'Costo Total',
                            data: Array.from({length: 25}, (_, i) => cf + cv * (i*20) + 0.01 * Math.pow(i*20, 2)),
                            borderColor: '#f59e0b',
                            backgroundColor: 'rgba(245, 158, 11, 0.1)',
                            tension: 0.4,
                            borderWidth: 3
                        },
                        {
                            label: 'Ingreso Total',
                            data: Array.from({length: 25}, (_, i) => precio * (i*20)),
                            borderColor: '#10b981',
                            backgroundColor: 'rgba(16, 185, 129, 0.1)',
                            tension: 0.4,
                            borderWidth: 3
                        }
                    ]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { position: 'top', labels: { color: '#d1d5db' }}
                    },
                    scales: {
                        y: { grid: { color: '#27272a' }, ticks: { color: '#9ca3af' }},
                        x: { grid: { color: '#27272a' }, ticks: { color: '#9ca3af' }}
                    }
                }
            });
        }

        function cerrarSesion() {
            if (confirm("¿Estás seguro de cerrar sesión?")) {
                window.location.href = "login.html";
            }
        }

        // Calcular al cargar la página
        window.onload = calcularOptimo;
    </script>
</body>
</html>
