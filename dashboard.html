<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - PrediCalc</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', system-ui, sans-serif; }
        .card { transition: all 0.3s; }
        .card:hover { transform: translateY(-5px); }
    </style>
</head>
<body class="bg-zinc-950 text-white min-h-screen">

    <!-- Navbar -->
    <nav class="bg-black border-b border-zinc-800">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 bg-orange-500 rounded-xl flex items-center justify-center text-2xl">📊</div>
                <h1 class="text-2xl font-bold">PrediCalc</h1>
            </div>
            <div class="flex items-center gap-6">
                <span class="text-zinc-400 text-sm">Therius Carrasco - Demo</span>
                <button onclick="cerrarSesion()" 
                        class="bg-red-500/10 hover:bg-red-500/20 text-red-400 px-5 py-2 rounded-2xl text-sm font-medium transition-all flex items-center gap-2">
                    <i class="fas fa-sign-out-alt"></i> Cerrar Sesión
                </button>
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-6 py-8">
        <h1 class="text-4xl font-bold mb-2">Simulador de Maximización de Utilidades</h1>
        <p class="text-zinc-400">Aplicación del Cálculo Diferencial - Nivel II</p>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 mt-10">

            <!-- Formulario -->
            <div class="lg:col-span-1">
                <div class="bg-zinc-900 border border-zinc-700 rounded-3xl p-8 card">
                    <h2 class="text-xl font-semibold mb-6 flex items-center gap-3">
                        <i class="fas fa-calculator text-orange-500"></i> Ingresar Datos
                    </h2>

                    <form id="calcForm">
                        <div class="space-y-5">
                            <div>
                                <label class="block text-sm text-zinc-400 mb-2">Producción Actual (unidades)</label>
                                <input type="number" id="produccion" value="200" class="w-full bg-zinc-800 border border-zinc-700 rounded-2xl py-4 px-5 focus:outline-none focus:border-orange-500">
                            </div>
                            <div>
                                <label class="block text-sm text-zinc-400 mb-2">Costo Fijo (S/)</label>
                                <input type="number" id="cf" value="1200" class="w-full bg-zinc-800 border border-zinc-700 rounded-2xl py-4 px-5 focus:outline-none focus:border-orange-500">
                            </div>
                            <div>
                                <label class="block text-sm text-zinc-400 mb-2">Costo Variable por Unidad (S/)</label>
                                <input type="number" id="cv" value="15" step="0.1" class="w-full bg-zinc-800 border border-zinc-700 rounded-2xl py-4 px-5 focus:outline-none focus:border-orange-500">
                            </div>
                            <div>
                                <label class="block text-sm text-zinc-400 mb-2">Precio de Venta por Unidad (S/)</label>
                                <input type="number" id="precio" value="28" step="0.1" class="w-full bg-zinc-800 border border-zinc-700 rounded-2xl py-4 px-5 focus:outline-none focus:border-orange-500">
                            </div>

                            <button type="button" onclick="calcularOptimo()"
                                    class="w-full bg-gradient-to-r from-orange-500 to-amber-500 py-5 rounded-2xl font-bold text-lg hover:scale-105 transition-all mt-4">
                                CALCULAR PUNTO ÓPTIMO
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Resultados -->
            <div class="lg:col-span-2">
                <div class="bg-zinc-900 border border-zinc-700 rounded-3xl p-8 card">
                    <h2 class="text-xl font-semibold mb-6">Resultados del Análisis</h2>
                    
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6" id="resultados">
                        <!-- Se llenan con JavaScript -->
                    </div>

                    <!-- Gráfica -->
                    <div class="mt-10">
                        <h3 class="text-lg font-medium mb-4">Gráfica de Costos e Ingresos</h3>
                        <canvas id="chart" height="100"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let myChart;

        function calcularOptimo() {
            const produccion = parseFloat(document.getElementById('produccion').value) || 200;
            const cf = parseFloat(document.getElementById('cf').value) || 1200;
            const cv = parseFloat(document.getElementById('cv').value) || 15;
            const precio = parseFloat(document.getElementById('precio').value) || 28;

            // Cálculos usando Cálculo Diferencial
            const qOptimo = Math.round((precio - cv) / (2 * 0.01)); // Ejemplo simplificado
            const utilidadMax = Math.round((precio - cv) * qOptimo - cf - 0.01 * Math.pow(qOptimo, 2));
            const costoTotal = cf + cv * qOptimo + 0.01 * Math.pow(qOptimo, 2);
            const ingresoTotal = precio * qOptimo;

            // Mostrar resultados
            document.getElementById('resultados').innerHTML = `
                <div class="bg-zinc-800 rounded-3xl p-6 text-center">
                    <p class="text-zinc-400 text-sm">Producción Óptima</p>
                    <p class="text-4xl font-bold text-emerald-400 mt-2">${qOptimo}</p>
                    <p class="text-xs text-emerald-500">unidades</p>
                </div>
                <div class="bg-zinc-800 rounded-3xl p-6 text-center">
                    <p class="text-zinc-400 text-sm">Utilidad Máxima</p>
                    <p class="text-4xl font-bold text-emerald-400 mt-2">S/ ${utilidadMax.toLocaleString()}</p>
                </div>
                <div class="bg-zinc-800 rounded-3xl p-6 text-center">
                    <p class="text-zinc-400 text-sm">Costo Marginal en Óptimo</p>
                    <p class="text-4xl font-bold text-amber-400 mt-2">0.00</p>
                </div>
            `;

            // Actualizar gráfica
            actualizarGrafica(qOptimo, cf, cv, precio);
        }

        function actualizarGrafica(qOpt, cf, cv, precio) {
            const ctx = document.getElementById('chart');
            if (myChart) myChart.destroy();

            myChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: Array.from({length: 30}, (_, i) => i * 20),
                    datasets: [
                        {
                            label: 'Costo Total',
                            data: Array.from({length: 30}, (_, i) => cf + cv * i * 20 + 0.01 * Math.pow(i * 20, 2)),
                            borderColor: '#f59e0b',
                            tension: 0.4
                        },
                        {
                            label: 'Ingreso Total',
                            data: Array.from({length: 30}, (_, i) => precio * i * 20),
                            borderColor: '#10b981',
                            tension: 0.4
                        }
                    ]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { position: 'top' } }
                }
            });
        }

        function cerrarSesion() {
            if (confirm("¿Cerrar sesión?")) {
                window.location.href = "login.html";
            }
        }

        // Calcular automáticamente al cargar
        window.onload = () => {
            calcularOptimo();
        };
    </script>
</body>
</html>
